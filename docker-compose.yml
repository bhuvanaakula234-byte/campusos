version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: campusos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema_complete.sql:/docker-entrypoint-initdb.d/schema_complete.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - JDBC_DATABASE_URL=jdbc:postgresql://db:5432/campusos
      - JDBC_DATABASE_USERNAME=postgres
      - JDBC_DATABASE_PASSWORD=postgres
      - APP_JWT_SECRET=change-this-secret-please-change-this-to-a-strong-key
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
